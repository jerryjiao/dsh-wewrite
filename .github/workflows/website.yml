# 官网自动发布：构建 Astro 站点并部署到 GitHub Pages。
# 站点地址：https://jerryjiao.github.io/dsh-wewrite/（astro.config base='/dsh-wewrite/'）
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'assets/logo/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次 Pages 部署，后来者取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建官网
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: 构建
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: 验证 Pages base 前缀
        run: |
          test -f website/dist/index.html
          grep -q '/dsh-wewrite/' website/dist/index.html

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
