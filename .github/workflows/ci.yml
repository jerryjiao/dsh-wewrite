# CI：push / PR 到 main 时跑插件门禁 + 官网构建校验。
# release.yml 通过 workflow_call 复用本文件的 plugin-gate job。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-gate:
    name: 插件门禁 (lint/typecheck/test/p0/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 门禁（lint → typecheck → test → P0 → build）
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
          npm run check:p0
          npm run build

      - name: 验证构建产物契约
        run: |
          test -f lib/client.js
          grep -q '__ModuleLoader__' lib/client.js
          echo "lib/client.js 存在且含 __ModuleLoader__ 加载契约标记"

      # lib/ 自 2026-08-28 起不再入库（.gitignore 忽略），改由 prepublishOnly 在发布时
      # 构建并打进 npm 包。所以这里不再比对 git 里的 lib/（已恒为空），改为校验 npm 包
      # 真实内容：发布产物必须含运行所需的 lib/ 与 cordis.patch.yml，防止 files 白名单
      # 或构建配置出错导致安装侧拿到残包。
      - name: 校验 npm 包内容（lib/ + cordis.patch.yml）
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("/tmp/pack.json", "utf8"))[0].files.map((f) => f.path);
            const need = ["lib/index.js", "lib/client.js", "lib/shared.js", "cordis.patch.yml", "package.json"];
            const missing = need.filter((p) => !files.includes(p));
            if (missing.length) {
              console.error("npm 包缺少必需文件: " + missing.join(", "));
              process.exit(1);
            }
            console.log("npm 包包含: " + need.join(", "));
          '

  website-build:
    name: 官网构建校验
    # workflow_call 复用时（release.yml）只跑插件门禁，不重复构建官网
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: P0 视觉门禁（website 机械子集：src 内 ts/css，astro 组件走评审）
        run: node scripts/checks/scan-p0.mjs --paths website/src

      - name: 构建官网
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: 验证 Pages base 前缀
        run: |
          test -f website/dist/index.html
          grep -q '/dsh-wewrite/' website/dist/index.html
          echo "website/dist/index.html 存在且资源引用带 /dsh-wewrite/ 前缀"
